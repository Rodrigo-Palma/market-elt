version: 2

sources:
  - name: raw
    schema: raw
    description: "Loaded by market_elt.ingest against a typed CSV contract."
    tables:
      - name: prices
        description: "Daily close prices, one row per (ticker, date) as delivered."
        config:
          # Measures when the file was loaded, not how recent the prices are.
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}
        columns:
          - name: date
            data_type: date
            data_tests: [not_null]
          - name: ticker
            data_type: varchar
            data_tests: [not_null]
          - name: close
            data_type: double
          - name: loaded_at
            data_type: timestamp with time zone
            data_tests: [not_null]

models:
  - name: stg_prices
    description: "Typed daily close prices that pass every row-level rule."
    config:
      contract: {enforced: true}
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, price_date]
    columns:
      - name: price_date
        data_type: date
        data_tests:
          - not_null
          # Off unless max_price_age_days is set: the bundled sample is a
          # fixed file, so a recency rule on by default would fail every run.
          - max_date_at_most_days_old:
              arguments:
                max_age_days: "{{ var('max_price_age_days') }}"
                as_of: "{{ var('as_of_date') }}"
              config:
                enabled: "{{ var('max_price_age_days') is not none }}"
      - name: ticker
        data_type: varchar
        data_tests: [not_null]
      - name: close
        data_type: double
        data_tests: [not_null]

  - name: stg_prices_rejected
    description: >
      Raw rows that break a row-level rule, with the reason. Gated by
      row_count_at_most: any rejected row fails the build unless the
      max_rejected_rows var raises the tolerance.
    config:
      contract: {enforced: true}
    data_tests:
      - row_count_at_most:
          arguments:
            max_rows: "{{ var('max_rejected_rows') }}"
    columns:
      - name: price_date
        data_type: date
      - name: ticker
        data_type: varchar
      - name: close
        data_type: double
      - name: reject_reason
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [blank_ticker, null_close, nan_close, infinite_close, non_positive_close]
