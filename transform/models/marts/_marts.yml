version: 2

models:
  - name: daily_metrics
    description: "Per-ticker summary: observations, last close, annualized volatility."
    config:
      contract: {enforced: true}
    columns:
      - name: ticker
        data_type: varchar
        data_tests: [not_null, unique]
      - name: observations
        data_type: bigint
        data_tests: [not_null]
      - name: last_date
        data_type: date
        data_tests: [not_null]
      - name: last_close
        data_type: double
        data_tests: [not_null]
      - name: annualized_volatility
        description: "Sample stddev of daily simple returns times sqrt(252). Null with < 3 prices."
        data_type: double

  - name: features_daily
    description: >
      Point-in-time features per (ticker, price_date) for model training and
      scoring. As-of semantics: the row for date D uses only prices dated on
      or before D, so it is exactly what was knowable at the close of D.
      Windows are the last 20 rows (trading days present in the data), not
      calendar days, and include the current row. Daily, not annualized.
    config:
      contract: {enforced: true}
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, price_date]
    columns:
      - name: ticker
        data_type: varchar
        data_tests: [not_null]
      - name: price_date
        data_type: date
        data_tests: [not_null]
      - name: close
        data_type: double
        data_tests: [not_null]
      - name: return_1d
        description: "close / previous close - 1. Null on a ticker's first date."
        data_type: double
      - name: rolling_vol_20d
        description: "Sample stddev of return_1d over the trailing 20 rows. Null with < 2 returns."
        data_type: double
      - name: rolling_mean_return_20d
        description: "Mean of return_1d over the trailing 20 rows."
        data_type: double
      - name: n_obs_window
        description: "Non-null returns in the trailing window (0 to 20). Filter on it for a full window."
        data_type: bigint
        data_tests: [not_null]

unit_tests:
  - name: daily_metrics_matches_reference
    description: >
      Expected rows come from scripts/daily_metrics_reference.py (stdlib,
      two-pass stdev), not from the SQL. Covers unsorted input dates, a
      ticker with one price (no return) and one with two prices (one return,
      so the sample stddev is null).
    model: daily_metrics
    given:
      - input: ref('stg_prices')
        rows:
          - {price_date: "2026-01-05", ticker: AAA, close: 101.0}
          - {price_date: "2026-01-01", ticker: AAA, close: 100.0}
          - {price_date: "2026-01-03", ticker: AAA, close: 99.0}
          - {price_date: "2026-01-02", ticker: AAA, close: 102.0}
          - {price_date: "2026-01-02", ticker: BBB, close: 20.0}
          - {price_date: "2026-01-02", ticker: CCC, close: 50.0}
          - {price_date: "2026-01-01", ticker: CCC, close: 40.0}
    expect:
      rows:
        - {ticker: AAA, observations: 4, last_date: "2026-01-05", last_close: 101.0, annualized_volatility: 0.4537949098}
        - {ticker: BBB, observations: 1, last_date: "2026-01-02", last_close: 20.0, annualized_volatility: null}
        - {ticker: CCC, observations: 2, last_date: "2026-01-02", last_close: 50.0, annualized_volatility: null}
