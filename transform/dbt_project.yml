name: market_elt
version: "1.0.0"
config-version: 2

flags:
  send_anonymous_usage_stats: false

profile: market_elt

model-paths: ["models"]
test-paths: ["tests"]

models:
  market_elt:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  # Rows allowed in stg_prices_rejected before the build fails.
  max_rejected_rows: 0
  # Latest price_date in stg_prices may be at most this many calendar days
  # before as_of_date (default current_date). Null turns the check off.
  max_price_age_days: null
  as_of_date: null
  # Rows per ticker that an incremental features_daily run reads from before
  # its last loaded date. The first new date needs 20: 19 for the
  # `19 preceding` window and 1 for the lag() of the oldest return in it.
  features_lookback_rows: 20
