[project]
name = "market-elt"
version = "0.1.0"
description = "A reproducible DuckDB + dbt ELT pipeline over market data, with data-quality tests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Stachlewski Palma" }]
keywords = ["data-engineering", "dbt", "duckdb", "elt", "analytics-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "duckdb>=1.0",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
market-elt = "market_elt.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/Rodrigo-Palma/market-elt"
Repository = "https://github.com/Rodrigo-Palma/market-elt"
Issues = "https://github.com/Rodrigo-Palma/market-elt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_elt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q --cov=market_elt --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
